name: Actualizar temperaturas

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python Temperaturas_Cuatro_Vientos_v8.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add datos_estacion_3195.json
          git commit -m "Actualización automática de datos" || echo "Sin cambios"
          git push
