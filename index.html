<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador CuatroVientos - AEMET</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    th, td { text-align: center; padding: 3px 5px; font-size: 11px; white-space: nowrap; }
    .sticky-col { position: sticky; left: 0; background-color: #f3f4f6; font-weight: bold; z-index: 10; }
  </style>
</head>
<body class="bg-gray-100 p-4 text-gray-800 font-sans">

  <!-- TOP BAR: Tarjetas y Filtros -->
  <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
    
    <!-- Tarjetas -->
    <div class="flex gap-4">
      <div class="bg-white p-3 rounded-lg shadow border border-gray-300 text-center min-w-[130px]">
        <div id="card1-val" class="text-2xl font-bold text-red-600">--</div>
        <div class="text-xs text-gray-600">Anterior: <span id="card1-ant">--</span></div>
        <div id="card1-pct" class="text-xs text-gray-600 font-semibold">(0,00 %)</div>
      </div>
      
      <div class="bg-white p-3 rounded-lg shadow border border-gray-300 text-center min-w-[130px]">
        <div id="card2-val" class="text-2xl font-bold text-green-600">--</div>
        <div class="text-xs text-gray-600">Anterior: <span id="card2-ant">--</span></div>
        <div id="card2-pct" class="text-xs text-gray-600 font-semibold">(0,00 %)</div>
      </div>
    </div>

    <!-- Fecha Cargada -->
    <div class="bg-white px-6 py-2 rounded-lg shadow border border-gray-300 text-center">
      <div class="text-xs text-gray-500 font-medium">Última fecha cargada</div>
      <div id="fecha-cargada" class="text-base font-bold">--/--/----</div>
    </div>

    <!-- Filtros -->
    <div class="flex gap-3 bg-white p-2 rounded-lg shadow border border-gray-300">
      <div>
        <label class="block text-[10px] text-gray-500">Año</label>
        <select id="filtro-anio" class="border rounded px-2 py-1 text-xs"><option>Todas</option></select>
      </div>
      <div>
        <label class="block text-[10px] text-gray-500">Mes</label>
        <select id="filtro-mes" class="border rounded px-2 py-1 text-xs"><option>Todas</option></select>
      </div>
      <div>
        <label class="block text-[10px] text-gray-500">Día</label>
        <select id="filtro-dia" class="border rounded px-2 py-1 text-xs"><option>Todas</option></select>
      </div>
    </div>
  </div>

  <!-- TABLAS DE DATOS -->
  <div class="space-y-6">
    <div class="overflow-x-auto bg-white rounded shadow border border-gray-300">
      <table id="tabla-roja" class="w-full border-collapse"></table>
    </div>

    <div class="overflow-x-auto bg-white rounded shadow border border-gray-300">
      <table id="tabla-verde" class="w-full border-collapse"></table>
    </div>
  </div>

  <script>
    // Usamos jsDelivr CDN para evitar los bloqueos CORS de GitHub Raw
    const JSON_URL = 'https://cdn.jsdelivr.net/gh/zakkaryas/CuatroVientos/datos_estacion_3195.json';
    const NOMBRES_MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

    // Convierte valores con coma ("12,5") o números directos a Float
    function parseNum(val) {
      if (val === undefined || val === null || val === "") return null;
      if (typeof val === 'number') return val;
      const parsed = parseFloat(val.toString().replace(',', '.'));
      return isNaN(parsed) ? null : parsed;
    }

    async function cargarDatos() {
      try {
        const response = await fetch(JSON_URL);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        const rawData = await response.json();

        // Ordenar datos por fecha
        rawData.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

        const { anios, promediosTmax, promediosTmed, ultimoRegistro, penultimoRegistro } = procesarDatosAEMET(rawData);

        // Actualizar Top Bar
        if (ultimoRegistro) {
          document.getElementById('fecha-cargada').innerText = ultimoRegistro.fecha.split('-').reverse().join('/');
        }
        
        if (ultimoRegistro && penultimoRegistro) {
          actualizarTarjeta('card1', parseNum(ultimoRegistro.tmax), parseNum(penultimoRegistro.tmax));
          actualizarTarjeta('card2', parseNum(ultimoRegistro.tmed), parseNum(penultimoRegistro.tmed));
        }

        // Poblar Selector de Años
        const selectorAnio = document.getElementById('filtro-anio');
        selectorAnio.innerHTML = '<option>Todas</option>';
        anios.forEach(a => {
          selectorAnio.innerHTML += `<option value="${a}">${a}</option>`;
        });

        // Renderizar Tablas
        renderizarTabla('tabla-roja', anios, promediosTmax, 'rojo');
        renderizarTabla('tabla-verde', anios, promediosTmed, 'verde');

      } catch (error) {
        console.error("Error al cargar los datos:", error);
        alert("No se pudieron cargar los datos del JSON. Verifica que la ruta o el nombre del archivo en GitHub sea 'datos.json'.");
      }
    }

    function procesarDatosAEMET(data) {
      const acumulador = {};
      const aniosSet = new Set();

      data.forEach(reg => {
        if (!reg.fecha) return;
        const partes = reg.fecha.split('-');
        const anio = parseInt(partes[0], 10);
        const mesIdx = parseInt(partes[1], 10) - 1;

        aniosSet.add(anio);

        if (!acumulador[anio]) acumulador[anio] = {};
        if (!acumulador[anio][mesIdx]) {
          acumulador[anio][mesIdx] = { tmaxSum: 0, tmaxCnt: 0, tmedSum: 0, tmedCnt: 0 };
        }

        const vMax = parseNum(reg.tmax);
        const vMed = parseNum(reg.tmed);

        if (vMax !== null) {
          acumulador[anio][mesIdx].tmaxSum += vMax;
          acumulador[anio][mesIdx].tmaxCnt++;
        }
        if (vMed !== null) {
          acumulador[anio][mesIdx].tmedSum += vMed;
          acumulador[anio][mesIdx].tmedCnt++;
        }
      });

      const anios = Array.from(aniosSet).sort((a, b) => a - b);
      const promediosTmax = {};
      const promediosTmed = {};

      NOMBRES_MESES.forEach((mes, mIdx) => {
        promediosTmax[mes] = [];
        promediosTmed[mes] = [];

        anios.forEach(anio => {
          const celda = acumulador[anio]?.[mIdx];
          promediosTmax[mes].push(celda && celda.tmaxCnt > 0 ? celda.tmaxSum / celda.tmaxCnt : null);
          promediosTmed[mes].push(celda && celda.tmedCnt > 0 ? celda.tmedSum / celda.tmedCnt : null);
        });
      });

      return {
        anios,
        promediosTmax,
        promediosTmed,
        ultimoRegistro: data[data.length - 1],
        penultimoRegistro: data[data.length - 2]
      };
    }

    function actualizarTarjeta(idPrefix, valActual, valAnterior) {
      if (valActual === null || valAnterior === null) return;
      const pct = ((valActual - valAnterior) / Math.abs(valAnterior)) * 100;
      const pctSigno = pct >= 0 ? '+' : '';

      document.getElementById(`${idPrefix}-val`).innerText = valActual.toFixed(2).replace('.', ',');
      document.getElementById(`${idPrefix}-ant`).innerText = valAnterior.toFixed(2).replace('.', ',');
      document.getElementById(`${idPrefix}-pct`).innerText = `(${pctSigno}${pct.toFixed(2).replace('.', ',')} %)`;
    }

    function renderizarTabla(idTabla, anios, datosMeses, tipoColor) {
      const tabla = document.getElementById(idTabla);
      tabla.innerHTML = '';

      let headerHTML = `<tr class="border-b bg-gray-50"><th class="sticky-col">Mes</th>`;
      anios.forEach(a => headerHTML += `<th>${a}</th>`);
      headerHTML += `</tr>`;
      tabla.innerHTML += headerHTML;

      NOMBRES_MESES.forEach(mes => {
        let filaHTML = `<tr class="border-b"><td class="sticky-col capitalize">${mes}</td>`;
        const valores = datosMeses[mes] || [];

        valores.forEach(val => {
          if (val !== null && val !== undefined) {
            const colorBg = calcularColorHeatmap(val, tipoColor);
            filaHTML += `<td style="background-color: ${colorBg};">${val.toFixed(2).replace('.', ',')}</td>`;
          } else {
            filaHTML += `<td></td>`;
          }
        });

        filaHTML += `</tr>`;
        tabla.innerHTML += filaHTML;
      });
    }

    function calcularColorHeatmap(valor, tipo) {
      if (tipo === 'rojo') {
        const min = 8, max = 36;
        const pct = Math.min(Math.max((valor - min) / (max - min), 0), 1);
        return `rgb(255, ${Math.round(255 - (pct * 190))}, ${Math.round(255 - (pct * 210))})`;
      } else {
        const min = -1, max = 22;
        const pct = Math.min(Math.max((valor - min) / (max - min), 0), 1);
        return `rgb(${Math.round(180 - (pct * 150))}, ${Math.round(230 + (pct * 25))}, ${Math.round(180 - (pct * 120))})`;
      }
    }

    cargarDatos();
  </script>
</body>
</html>
