<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador CuatroVientos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    th, td { text-align: center; padding: 3px 4px; font-size: 11px; white-space: nowrap; }
    .sticky-col { position: sticky; left: 0; background-color: #ffffff; font-weight: bold; z-index: 10; border-right: 1px solid #e5e7eb; }
    .card-shadow { box-shadow: 0 4px 10px rgba(0,0,0,0.12); }
  </style>
</head>
<body class="bg-gray-200 p-4 text-gray-800 font-sans">

  <div id="status-message" class="mb-4 p-2 bg-blue-100 text-blue-800 rounded border border-blue-300 text-xs text-center">
    Cargando datos...
  </div>

  <!-- TOP BAR -->
  <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
    
    <!-- Tarjetas -->
    <div class="flex gap-4">
      <div class="bg-white px-5 py-2 rounded-xl card-shadow border border-gray-200 text-center min-w-[130px]">
        <div class="text-2xl font-bold text-red-600"><span id="card1-val">--</span><span class="text-red-500 ml-0.5">!</span></div>
        <div class="text-xs text-gray-700 font-medium mt-0.5">Anterior: <span id="card1-ant">--</span></div>
        <div id="card1-pct" class="text-xs text-gray-700 font-semibold">(+0,00 %)</div>
      </div>
      
      <div class="bg-white px-5 py-2 rounded-xl card-shadow border border-gray-200 text-center min-w-[130px]">
        <div class="text-2xl font-bold text-red-600"><span id="card2-val">--</span><span class="text-red-500 ml-0.5">!</span></div>
        <div class="text-xs text-gray-700 font-medium mt-0.5">Anterior: <span id="card2-ant">--</span></div>
        <div id="card2-pct" class="text-xs text-gray-700 font-semibold">(+0,00 %)</div>
      </div>
    </div>

    <!-- Fecha Cargada -->
    <div class="bg-white px-8 py-2 rounded-xl card-shadow border border-gray-200 text-center">
      <div class="text-xs text-gray-600 font-medium mb-1">Última fecha cargada</div>
      <div id="fecha-cargada" class="text-base font-bold">--/--/----</div>
    </div>

    <!-- Filtros -->
    <div class="flex gap-3 bg-white px-3 py-2 rounded-xl card-shadow border border-gray-200">
      <div>
        <label class="block text-[10px] text-gray-500 mb-0.5">Año</label>
        <select id="filtro-anio" class="border rounded px-2 py-0.5 text-xs"><option value="Todas">Todas</option></select>
      </div>
      <div>
        <label class="block text-[10px] text-gray-500 mb-0.5">Mes</label>
        <select id="filtro-mes" class="border rounded px-2 py-0.5 text-xs"><option value="Todas">Todas</option></select>
      </div>
      <div>
        <label class="block text-[10px] text-gray-500 mb-0.5">Día</label>
        <select id="filtro-dia" class="border rounded px-2 py-0.5 text-xs"><option value="Todas">Todas</option></select>
      </div>
    </div>
  </div>

  <!-- TABLAS -->
  <div class="space-y-6">
    <div class="overflow-x-auto bg-white rounded-lg shadow border border-gray-300">
      <table id="tabla-roja" class="w-full border-collapse"></table>
    </div>

    <div class="overflow-x-auto bg-white rounded-lg shadow border border-gray-300">
      <table id="tabla-verde" class="w-full border-collapse"></table>
    </div>
  </div>

  <script>
    const RUTAS_JSON = [
      'https://raw.githubusercontent.com/Zakkaryas/CuatroVientos/refs/heads/main/datos_estacion_3195.json'
    ];

    const MESES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

    let globalRawData = [];

    function parseNum(val) {
      if (val === undefined || val === null || val === "") return null;
      if (typeof val === 'number') return val;
      const parsed = parseFloat(val.toString().replace(',', '.'));
      return isNaN(parsed) ? null : parsed;
    }

    function formatNum(val) {
      if (val === null || val === undefined) return '';
      return val.toFixed(2).replace('.', ',');
    }

    async function obtenerDatos() {
      for (const url of RUTAS_JSON) {
        try {
          const response = await fetch(url);
          if (response.ok) {
            const data = await response.json();
            if (Array.isArray(data) && data.length > 0) return data;
          }
        } catch (e) {}
      }
      throw new Error("No se pudo cargar el JSON.");
    }

    async function cargarDatos() {
      const statusElement = document.getElementById('status-message');
      try {
        globalRawData = await obtenerDatos();
        statusElement.style.display = 'none';

        globalRawData.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

        inicializarFiltros();
        actualizarDashboard();
        
        // Asignar eventos de escucha a los filtros
        document.getElementById('filtro-anio').addEventListener('change', () => {
          poblarDias();
          actualizarDashboard();
        });
        document.getElementById('filtro-mes').addEventListener('change', () => {
          poblarDias();
          actualizarDashboard();
        });
        document.getElementById('filtro-dia').addEventListener('change', actualizarDashboard);

      } catch (error) {
        statusElement.className = "mb-4 p-2 bg-red-100 text-red-800 rounded border border-red-300 text-xs text-center font-bold";
        statusElement.innerText = "Error al procesar el archivo 'datos.json'.";
      }
    }

    function inicializarFiltros() {
      const aniosSet = new Set();
      globalRawData.forEach(reg => {
        if (reg.fecha) {
          aniosSet.add(reg.fecha.split('-')[0]);
        }
      });

      const selectorAnio = document.getElementById('filtro-anio');
      selectorAnio.innerHTML = '<option value="Todas">Todas</option>';
      Array.from(aniosSet).sort((a, b) => a - b).forEach(a => {
        selectorAnio.innerHTML += `<option value="${a}">${a}</option>`;
      });

      const selectorMes = document.getElementById('filtro-mes');
      selectorMes.innerHTML = '<option value="Todas">Todas</option>';
      MESES.forEach((m, idx) => {
        selectorMes.innerHTML += `<option value="${idx + 1}">${m}</option>`;
      });

      poblarDias();
    }

    function poblarDias() {
      const selectorDia = document.getElementById('filtro-dia');
      const valDiaActual = selectorDia.value;
      selectorDia.innerHTML = '<option value="Todas">Todas</option>';
      for (let i = 1; i <= 31; i++) {
        const dStr = i < 10 ? `0${i}` : `${i}`;
        selectorDia.innerHTML += `<option value="${dStr}">${i}</option>`;
      }
      selectorDia.value = valDiaActual || "Todas";
    }

    function actualizarDashboard() {
      const fAnio = document.getElementById('filtro-anio').value;
      const fMes = document.getElementById('filtro-mes').value;
      const fDia = document.getElementById('filtro-dia').value;

      // Filtrar datos según la selección actual
      const datosFiltrados = globalRawData.filter(reg => {
        if (!reg.fecha) return false;
        const [yyyy, mm, dd] = reg.fecha.split('-');
        if (fAnio !== "Todas" && yyyy !== fAnio) return false;
        if (fMes !== "Todas" && parseInt(mm, 10) !== parseInt(fMes, 10)) return false;
        if (fDia !== "Todas" && dd !== fDia) return false;
        return true;
      });

      const { anios, promediosTmax, promediosTmed, mediasAnualesTmax, mediasAnualesTmed, ultimoRegistro, registroAnioAnterior } = procesarAEMET(datosFiltrados);

      // Actualizar Fecha en cabecera
      const regParaFecha = ultimoRegistro || globalRawData[globalRawData.length - 1];
      if (regParaFecha) {
        const [yyyy, mm, dd] = regParaFecha.fecha.split('-');
        document.getElementById('fecha-cargada').innerText = `${dd}/${mm}/${yyyy}`;
      }

      // Actualizar KPIs
      if (ultimoRegistro) {
        actualizarTarjeta('card1', parseNum(ultimoRegistro.tmax), registroAnioAnterior ? parseNum(registroAnioAnterior.tmax) : null);
        actualizarTarjeta('card2', parseNum(ultimoRegistro.tmed), registroAnioAnterior ? parseNum(registroAnioAnterior.tmed) : null);
      } else {
        document.getElementById('card1-val').innerText = '--';
        document.getElementById('card1-ant').innerText = '--';
        document.getElementById('card1-pct').innerText = '(0,00 %)';
        document.getElementById('card2-val').innerText = '--';
        document.getElementById('card2-ant').innerText = '--';
        document.getElementById('card2-pct').innerText = '(0,00 %)';
      }

      // Renderizar Tablas
      renderizarTabla('tabla-roja', anios, promediosTmax, mediasAnualesTmax, 'rojo');
      renderizarTabla('tabla-verde', anios, promediosTmed, mediasAnualesTmed, 'verde');
    }

    function procesarAEMET(data) {
      const acumuladorMes = {};
      const acumuladorAnio = {};
      const aniosSet = new Set();
      const mapaPorFecha = {};

      globalRawData.forEach(reg => { if (reg.fecha) mapaPorFecha[reg.fecha] = reg; });

      data.forEach(reg => {
        if (!reg.fecha) return;

        const [anioStr, mesStr] = reg.fecha.split('-');
        const anio = parseInt(anioStr, 10);
        const mesIdx = parseInt(mesStr, 10) - 1;

        aniosSet.add(anio);

        if (!acumuladorMes[anio]) acumuladorMes[anio] = {};
        if (!acumuladorMes[anio][mesIdx]) {
          acumuladorMes[anio][mesIdx] = { tmaxSum: 0, tmaxCnt: 0, tmedSum: 0, tmedCnt: 0 };
        }

        if (!acumuladorAnio[anio]) {
          acumuladorAnio[anio] = { tmaxSum: 0, tmaxCnt: 0, tmedSum: 0, tmedCnt: 0 };
        }

        const vmax = parseNum(reg.tmax);
        const vmed = parseNum(reg.tmed);

        if (vmax !== null) {
          acumuladorMes[anio][mesIdx].tmaxSum += vmax;
          acumuladorMes[anio][mesIdx].tmaxCnt++;
          acumuladorAnio[anio].tmaxSum += vmax;
          acumuladorAnio[anio].tmaxCnt++;
        }
        if (vmed !== null) {
          acumuladorMes[anio][mesIdx].tmedSum += vmed;
          acumuladorMes[anio][mesIdx].tmedCnt++;
          acumuladorAnio[anio].tmedSum += vmed;
          acumuladorAnio[anio].tmedCnt++;
        }
      });

      const anios = Array.from(aniosSet).sort((a, b) => a - b);
      const promediosTmax = {};
      const promediosTmed = {};

      MESES.forEach((mes, mIdx) => {
        promediosTmax[mes] = [];
        promediosTmed[mes] = [];

        anios.forEach(anio => {
          const celda = acumuladorMes[anio]?.[mIdx];

          promediosTmax[mes].push(celda && celda.tmaxCnt > 0 ? celda.tmaxSum / celda.tmaxCnt : null);
          promediosTmed[mes].push(celda && celda.tmedCnt > 0 ? celda.tmedSum / celda.tmedCnt : null);
        });
      });

      const mediasAnualesTmax = anios.map(a => acumuladorAnio[a]?.tmaxCnt > 0 ? acumuladorAnio[a].tmaxSum / acumuladorAnio[a].tmaxCnt : null);
      const mediasAnualesTmed = anios.map(a => acumuladorAnio[a]?.tmedCnt > 0 ? acumuladorAnio[a].tmedSum / acumuladorAnio[a].tmedCnt : null);

      const ultimoRegistro = data[data.length - 1];
      let registroAnioAnterior = null;

      if (ultimoRegistro) {
        const [yyyy, mm, dd] = ultimoRegistro.fecha.split('-');
        const fechaAnioAnterior = `${parseInt(yyyy, 10) - 1}-${mm}-${dd}`;
        registroAnioAnterior = mapaPorFecha[fechaAnioAnterior] || null;
      }

      return {
        anios,
        promediosTmax,
        promediosTmed,
        mediasAnualesTmax,
        mediasAnualesTmed,
        ultimoRegistro,
        registroAnioAnterior
      };
    }

    function actualizarTarjeta(idPrefix, valActual, valAnterior) {
      if (valActual === null) return;

      document.getElementById(`${idPrefix}-val`).innerText = formatNum(valActual);

      if (valAnterior !== null && valAnterior !== 0) {
        const pct = ((valActual - valAnterior) / Math.abs(valAnterior)) * 100;
        const pctSigno = pct >= 0 ? '+' : '';

        document.getElementById(`${idPrefix}-ant`).innerText = formatNum(valAnterior);
        document.getElementById(`${idPrefix}-pct`).innerText = `(${pctSigno}${formatNum(pct)} %)`;
      } else {
        document.getElementById(`${idPrefix}-ant`).innerText = '--';
        document.getElementById(`${idPrefix}-pct`).innerText = '(0,00 %)';
      }
    }

    function renderizarTabla(idTabla, anios, datosMeses, mediasAnuales, tipoColor) {
      const tabla = document.getElementById(idTabla);
      tabla.innerHTML = '';

      let headerHTML = `<tr class="border-b bg-gray-50"><th class="sticky-col text-left px-3 py-1">Mes</th>`;
      anios.forEach(a => headerHTML += `<th class="px-2 py-1 font-semibold text-gray-700">${a}</th>`);
      headerHTML += `</tr>`;
      tabla.innerHTML += headerHTML;

      MESES.forEach(mes => {
        let filaHTML = `<tr class="border-b"><td class="sticky-col text-left px-3 py-1 capitalize font-medium text-gray-700">${mes}</td>`;
        const valores = datosMeses[mes] || [];

        valores.forEach(val => {
          if (val !== null && val !== undefined) {
            const colorBg = calcularColorHeatmap(val, tipoColor);
            filaHTML += `<td style="background-color: ${colorBg};" class="font-normal text-gray-800">${formatNum(val)}</td>`;
          } else {
            filaHTML += `<td></td>`;
          }
        });

        filaHTML += `</tr>`;
        tabla.innerHTML += filaHTML;
      });

      let footerHTML = `<tr class="border-t-2 border-gray-300 font-bold bg-gray-50"><td class="sticky-col text-left px-3 py-1 text-gray-800">Media</td>`;
      mediasAnuales.forEach(mediaVal => {
        footerHTML += `<td class="px-2 py-1">${formatNum(mediaVal)}</td>`;
      });
      footerHTML += `</tr>`;
      tabla.innerHTML += footerHTML;
    }

    function calcularColorHeatmap(valor, tipo) {
      if (tipo === 'rojo') {
        const min = 8, max = 36;
        const pct = Math.min(Math.max((valor - min) / (max - min), 0), 1);
        return `rgb(255, ${Math.round(255 - (pct * 190))}, ${Math.round(255 - (pct * 210))})`;
      } else {
        const min = -1, max = 22;
        const pct = Math.min(Math.max((valor - min) / (max - min), 0), 1);
        if (pct < 0.25) return `rgb(207, 232, 255)`;
        return `rgb(${Math.round(180 - (pct * 150))}, ${Math.round(230 + (pct * 25))}, ${Math.round(180 - (pct * 120))})`;
      }
    }

    cargarDatos();
  </script>
</body>
</html>
