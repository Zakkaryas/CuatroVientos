<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador CuatroVientos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    th, td { text-align: center; padding: 3px 4px; font-size: 11px; white-space: nowrap; }
    .sticky-col { position: sticky; left: 0; background-color: #ffffff; font-weight: bold; z-index: 10; border-right: 1px solid #e5e7eb; }
    .card-shadow { box-shadow: 0 4px 10px rgba(0,0,0,0.12); }
  </style>
</head>
<body class="bg-gray-200 p-4 text-gray-800 font-sans">

  <div id="status-message" class="mb-4 p-2 bg-blue-100 text-blue-800 rounded border border-blue-300 text-xs text-center">
    Cargando datos...
  </div>

  <!-- TOP BAR -->
  <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
    
    <!-- Tarjetas / KPIs -->
    <div class="flex gap-4">
      <div class="bg-white px-5 py-2 rounded-xl card-shadow border border-gray-200 text-center min-w-[130px]">
        <div class="text-2xl font-bold text-red-600"><span id="card1-val">--</span><span class="text-red-500 ml-0.5">!</span></div>
        <div class="text-xs text-gray-700 font-medium mt-0.5">Anterior: <span id="card1-ant">--</span></div>
        <div id="card1-pct" class="text-xs text-gray-700 font-semibold">(+0,00 %)</div>
      </div>
      
      <div class="bg-white px-5 py-2 rounded-xl card-shadow border border-gray-200 text-center min-w-[130px]">
        <div class="text-2xl font-bold text-red-600"><span id="card2-val">--</span><span class="text-red-500 ml-0.5">!</span></div>
        <div class="text-xs text-gray-700 font-medium mt-0.5">Anterior: <span id="card2-ant">--</span></div>
        <div id="card2-pct" class="text-xs text-gray-700 font-semibold">(+0,00 %)</div>
      </div>
    </div>

    <!-- Fecha Cargada -->
    <div class="bg-white px-8 py-2 rounded-xl card-shadow border border-gray-200 text-center">
      <div class="text-xs text-gray-600 font-medium mb-1">Última fecha cargada</div>
      <div id="fecha-cargada" class="text-base font-bold">--/--/----</div>
    </div>

    <!-- Filtros -->
    <div class="flex gap-3 bg-white px-3 py-2 rounded-xl card-shadow border border-gray-200">
      <div>
        <label class="block text-[10px] text-gray-500 mb-0.5">Año</label>
        <select id="filtro-anio" class="border rounded px-2 py-0.5 text-xs"><option value="Todas">Todas</option></select>
      </div>
      <div>
        <label class="block text-[10px] text-gray-500 mb-0.5">Mes</label>
        <select id="filtro-mes" class="border rounded px-2 py-0.5 text-xs"><option value="Todas">Todas</option></select>
      </div>
      <div>
        <label class="block text-[10px] text-gray-500 mb-0.5">Día</label>
        <select id="filtro-dia" class="border rounded px-2 py-0.5 text-xs"><option value="Todas">Todas</option></select>
      </div>
    </div>
  </div>

  <!-- TABLAS -->
  <div class="space-y-6">
    <!-- Tabla Promedio Mensual TMAX -->
    <div class="overflow-x-auto bg-white rounded-lg shadow border border-gray-300">
      <table id="tabla-roja" class="w-full border-collapse"></table>
    </div>

    <!-- Tabla Promedio Mensual TMIN -->
    <div class="overflow-x-auto bg-white rounded-lg shadow border border-gray-300">
      <table id="tabla-verde" class="w-full border-collapse"></table>
    </div>
  </div>

  <script>
    const RUTAS_JSON = [
       'https://raw.githubusercontent.com/zakkaryas/CuatroVientos/main/datos_estacion_3195.json'
    ];

    const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

    function parseNum(val) {
      if (val === undefined || val === null || val === "") return null;
      if (typeof val === 'number') return val;
      const parsed = parseFloat(val.toString().replace(',', '.'));
      return isNaN(parsed) ? null : parsed;
    }

    function formatNum(val) {
      if (val === null || val === undefined) return '';
      return val.toFixed(2).replace('.', ',');
    }

    async function obtenerDatos() {
      for (const url of RUTAS_JSON) {
        try {
          const response = await fetch(url);
          if (response.ok) {
            const data = await response.json();
            if (Array.isArray(data) && data.length > 0) return data;
          }
        } catch (e) {}
      }
      throw new Error("No se pudo cargar el JSON.");
    }

    async function cargarDatos() {
      const statusElement = document.getElementById('status-message');
      try {
        const rawData = await obtenerDatos();
        statusElement.style.display = 'none';

        rawData.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

        const { anios, promediosTmax, promediosTmin, ultimoRegistro, registroAnioAnterior } = procesarAEMET(rawData);

        // Actualizar Fecha
        if (ultimoRegistro) {
          const [yyyy, mm, dd] = ultimoRegistro.fecha.split('-');
          document.getElementById('fecha-cargada').innerText = `${dd}/${mm}/${yyyy}`;
        }

        // Actualizar KPIs comparando con la misma fecha del año anterior
        if (ultimoRegistro && registroAnioAnterior) {
          actualizarTarjeta('card1', parseNum(ultimoRegistro.tmax), parseNum(registroAnioAnterior.tmax));
          actualizarTarjeta('card2', parseNum(ultimoRegistro.tmin), parseNum(registroAnioAnterior.tmin));
        } else if (ultimoRegistro) {
          document.getElementById('card1-val').innerText = formatNum(parseNum(ultimoRegistro.tmax));
          document.getElementById('card2-val').innerText = formatNum(parseNum(ultimoRegistro.tmin));
        }

        // Selector Años
        const selectorAnio = document.getElementById('filtro-anio');
        selectorAnio.innerHTML = '<option value="Todas">Todas</option>';
        anios.forEach(a => {
          selectorAnio.innerHTML += `<option value="${a}">${a}</option>`;
        });

        // Renderizar Tablas con los promedios mensuales
        renderizarTabla('tabla-roja', anios, promediosTmax, 'rojo');
        renderizarTabla('tabla-verde', anios, promediosTmin, 'verde');

      } catch (error) {
        statusElement.className = "mb-4 p-2 bg-red-100 text-red-800 rounded border border-red-300 text-xs text-center font-bold";
        statusElement.innerText = "Error al procesar el archivo 'datos.json'.";
      }
    }

    function procesarAEMET(data) {
      const acumulador = {};
      const aniosSet = new Set();
      const mapaPorFecha = {};

      data.forEach(reg => {
        if (!reg.fecha) return;
        mapaPorFecha[reg.fecha] = reg;

        const [anioStr, mesStr] = reg.fecha.split('-');
        const anio = parseInt(anioStr, 10);
        const mesIdx = parseInt(mesStr, 10) - 1;

        aniosSet.add(anio);

        if (!acumulador[anio]) acumulador[anio] = {};
        if (!acumulador[anio][mesIdx]) {
          acumulador[anio][mesIdx] = { tmaxSum: 0, tmaxCnt: 0, tminSum: 0, tminCnt: 0 };
        }

        const vmax = parseNum(reg.tmax);
        const vmin = parseNum(reg.tmin);

        if (vmax !== null) {
          acumulador[anio][mesIdx].tmaxSum += vmax;
          acumulador[anio][mesIdx].tmaxCnt++;
        }
        if (vmin !== null) {
          acumulador[anio][mesIdx].tminSum += vmin;
          acumulador[anio][mesIdx].tminCnt++;
        }
      });

      const anios = Array.from(aniosSet).sort((a, b) => a - b);
      const promediosTmax = {};
      const promediosTmin = {};

      // Cálculo de promedios por mes y año
      MESES.forEach((mes, mIdx) => {
        promediosTmax[mes] = [];
        promediosTmin[mes] = [];

        anios.forEach(anio => {
          const celda = acumulador[anio]?.[mIdx];

          // Promedio tmax
          if (celda && celda.tmaxCnt > 0) {
            promediosTmax[mes].push(celda.tmaxSum / celda.tmaxCnt);
          } else {
            promediosTmax[mes].push(null);
          }

          // Promedio tmin
          if (celda && celda.tminCnt > 0) {
            promediosTmin[mes].push(celda.tminSum / celda.tminCnt);
          } else {
            promediosTmin[mes].push(null);
          }
        });
      });

      // Obtener el registro de la última fecha y el del año anterior para los KPIs
      const ultimoRegistro = data[data.length - 1];
      let registroAnioAnterior = null;

      if (ultimoRegistro) {
        const [yyyy, mm, dd] = ultimoRegistro.fecha.split('-');
        const fechaAnioAnterior = `${parseInt(yyyy, 10) - 1}-${mm}-${dd}`;
        registroAnioAnterior = mapaPorFecha[fechaAnioAnterior] || null;
      }

      return {
        anios,
        promediosTmax,
        promediosTmin,
        ultimoRegistro,
        registroAnioAnterior
      };
    }

    function actualizarTarjeta(idPrefix, valActual, valAnterior) {
      if (valActual === null) return;

      document.getElementById(`${idPrefix}-val`).innerText = formatNum(valActual);

      if (valAnterior !== null && valAnterior !== 0) {
        const pct = ((valActual - valAnterior) / Math.abs(valAnterior)) * 100;
        const pctSigno = pct >= 0 ? '+' : '';

        document.getElementById(`${idPrefix}-ant`).innerText = formatNum(valAnterior);
        document.getElementById(`${idPrefix}-pct`).innerText = `(${pctSigno}${formatNum(pct)} %)`;
      } else {
        document.getElementById(`${idPrefix}-ant`).innerText = '--';
        document.getElementById(`${idPrefix}-pct`).innerText = '(0,00 %)';
      }
    }

    function renderizarTabla(idTabla, anios, datosMeses, tipoColor) {
      const tabla = document.getElementById(idTabla);
      tabla.innerHTML = '';

      let headerHTML = `<tr class="border-b bg-gray-50"><th class="sticky-col text-left px-3 py-1">Mes</th>`;
      anios.forEach(a => headerHTML += `<th class="px-2 py-1 font-semibold text-gray-700">${a}</th>`);
      headerHTML += `</tr>`;
      tabla.innerHTML += headerHTML;

      const acumuladorAnual = anios.map(() => ({ sum: 0, count: 0 }));

      MESES.forEach(mes => {
        let filaHTML = `<tr class="border-b"><td class="sticky-col text-left px-3 py-1 capitalize font-medium text-gray-700">${mes}</td>`;
        const valores = datosMeses[mes] || [];

        valores.forEach((val, colIdx) => {
          if (val !== null && val !== undefined) {
            acumuladorAnual[colIdx].sum += val;
            acumuladorAnual[colIdx].count += 1;

            const colorBg = calcularColorHeatmap(val, tipoColor);
            filaHTML += `<td style="background-color: ${colorBg};" class="font-normal text-gray-800">${formatNum(val)}</td>`;
          } else {
            filaHTML += `<td></td>`;
          }
        });

        filaHTML += `</tr>`;
        tabla.innerHTML += filaHTML;
      });

      // Fila inferior con el promedio global del año
      let footerHTML = `<tr class="border-t-2 border-gray-300 font-bold bg-gray-50"><td class="sticky-col text-left px-3 py-1 text-gray-800">Media</td>`;
      acumuladorAnual.forEach(col => {
        if (col.count > 0) {
          const mediaAnual = col.sum / col.count;
          footerHTML += `<td class="px-2 py-1">${formatNum(mediaAnual)}</td>`;
        } else {
          footerHTML += `<td></td>`;
        }
      });
      footerHTML += `</tr>`;
      tabla.innerHTML += footerHTML;
    }

    function calcularColorHeatmap(valor, tipo) {
      if (tipo === 'rojo') {
        const min = 8, max = 36;
        const pct = Math.min(Math.max((valor - min) / (max - min), 0), 1);
        return `rgb(255, ${Math.round(255 - (pct * 190))}, ${Math.round(255 - (pct * 210))})`;
      } else {
        const min = -1, max = 22;
        const pct = Math.min(Math.max((valor - min) / (max - min), 0), 1);
        if (pct < 0.25) return `rgb(207, 232, 255)`;
        return `rgb(${Math.round(180 - (pct * 150))}, ${Math.round(230 + (pct * 25))}, ${Math.round(180 - (pct * 120))})`;
      }
    }

    cargarDatos();
  </script>
</body>
</html>
